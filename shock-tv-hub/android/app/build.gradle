plugins { id 'com.android.application' }
android {
  namespace 'br.com.shocktv'
  compileSdk 35
  defaultConfig {
    applicationId 'br.com.shocktv'
    minSdk 23
    targetSdk 34
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    versionCode 24
    versionName '1.0.0-rc15'
  }
  flavorDimensions 'device'
  productFlavors {
    tv {
      dimension 'device'
      buildConfigField 'boolean', 'MOBILE_UI', 'false'
    }
    mobile {
      dimension 'device'
      applicationId 'br.com.telares.play'
      versionName '0.1.1-rc15'
      buildConfigField 'boolean', 'MOBILE_UI', 'true'
    }
  }
  buildFeatures { buildConfig true }
  signingConfigs {
    permanent {
      if (System.getenv('SHOCK_TV_SIGNING_PATH')) {
        storeFile file(System.getenv('SHOCK_TV_SIGNING_PATH'))
        storePassword System.getenv('SHOCK_TV_SIGNING_STORE_PASSWORD')
        keyAlias System.getenv('SHOCK_TV_SIGNING_ALIAS')
        keyPassword System.getenv('SHOCK_TV_SIGNING_KEY_PASSWORD')
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.permanent
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test:core:1.6.1'

  implementation 'org.libtorrent4j:libtorrent4j:2.1.0-39'
  runtimeOnly 'org.libtorrent4j:libtorrent4j-android-arm:2.1.0-39'
  runtimeOnly 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-39'
  runtimeOnly 'org.libtorrent4j:libtorrent4j-android-x86:2.1.0-39'
  runtimeOnly 'org.libtorrent4j:libtorrent4j-android-x86_64:2.1.0-39'
  testRuntimeOnly 'org.libtorrent4j:libtorrent4j-linux:2.1.0-39'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
  implementation 'androidx.media3:media3-exoplayer:1.5.1'
  implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
  implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
  implementation 'androidx.media3:media3-ui:1.5.1'
}

apply from: 'branding.gradle'


tasks.withType(Test).configureEach {
  systemProperty 'telares.fixture', rootProject.file('../test-fixtures').absolutePath
  systemProperty 'java.library.path', "${buildDir}/test-native"
  doFirst {
    def nativeJar = configurations.tvDebugUnitTestRuntimeClasspath.files.find { it.name.startsWith('libtorrent4j-linux-') }
    if (nativeJar != null) {
      copy { from zipTree(nativeJar); include 'lib/x86_64/libtorrent4j.so'; into "${buildDir}/test-native"; eachFile { path = name }; includeEmptyDirs = false }
    }
  }
}
