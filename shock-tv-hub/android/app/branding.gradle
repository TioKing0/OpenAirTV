/*
 * Telares TV brand assets generated locally by Gradle, no external image host or PC setup.
 * Android TV launchers require a 320x180 xhdpi banner with legible branding.
 * Generates PNGs from Java2D on the Gradle JDK. Safe to rerun on any CI build.
 */
import java.awt.BasicStroke
import java.awt.Color
import java.awt.Font
import java.awt.GradientPaint
import java.awt.Graphics2D
import java.awt.RenderingHints
import java.awt.geom.Path2D
import java.awt.geom.RoundRectangle2D
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

def makeImage = { int width,int height ->
    BufferedImage canvas=new BufferedImage(width,height,BufferedImage.TYPE_INT_ARGB)
    Graphics2D g=canvas.createGraphics()
    g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_ON)
    g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,RenderingHints.VALUE_TEXT_ANTIALIAS_ON)
    g.setRenderingHint(RenderingHints.KEY_RENDERING,RenderingHints.VALUE_RENDER_QUALITY)
    g.setPaint(new GradientPaint(0f,0f,new Color(6,18,31),(float)width,(float)height,new Color(14,52,76)))
    g.fillRoundRect(0,0,width,height,Math.max(16,(int)(width * 0.065d)),Math.max(16,(int)(height * 0.12d)))
    return [canvas,g]
}
def drawPlay = { Graphics2D g, int x,int y,int w,int h ->
    g.setColor(new Color(16,64,81))
    g.fillRoundRect(x,y,w,h,(int)(w * 0.24d),(int)(w * 0.24d))
    g.setStroke(new BasicStroke(Math.max(2f,(float)(w * 0.022d))))
    g.setColor(new Color(104,216,233))
    g.drawRoundRect(x,y,w,h,(int)(w * 0.24d),(int)(w * 0.24d))
    Path2D.Double play=new Path2D.Double()
    play.moveTo(x+w * 0.36d,y+h * 0.25d)
    play.lineTo(x+w * 0.36d,y+h * 0.75d)
    play.lineTo(x+w * 0.77d,y+h * 0.50d)
    play.closePath()
    g.setColor(new Color(130,236,241))
    g.fill(play)
}
def brandBanner={ ->
    def parts=makeImage(320,180)
    BufferedImage out=(BufferedImage)parts[0]
    Graphics2D g=(Graphics2D)parts[1]
    drawPlay(g,24,31,93,118)
    g.setColor(new Color(243,251,255))
    g.setFont(new Font("SansSerif",Font.BOLD,28))
    g.drawString("TELARES",134,99)
    g.setColor(new Color(104,216,233))
    g.setFont(new Font("SansSerif",Font.BOLD,28))
    g.drawString("TV",136,132)
    g.setStroke(new BasicStroke(3f,BasicStroke.CAP_ROUND,BasicStroke.JOIN_ROUND))
    g.drawLine(136,140,285,140)
    g.dispose()
    return out
}
def brandIcon={ ->
    def parts=makeImage(192,192)
    BufferedImage out=(BufferedImage)parts[0]
    Graphics2D g=(Graphics2D)parts[1]
    drawPlay(g,28,18,136,146)
    g.setColor(new Color(245,250,255))
    g.setFont(new Font("SansSerif",Font.BOLD,21))
    g.drawString("TELARES",48,177)
    g.dispose()
    return out
}
tasks.register("generateTvBranding") {
    def bannerFile=file("src/main/res/drawable-xhdpi/shock_tv_banner.png")
    def iconFile=file("src/main/res/drawable-nodpi/shock_tv_icon.png")
    outputs.files(bannerFile,iconFile)
    doLast {
        System.setProperty("java.awt.headless","true")
        bannerFile.parentFile.mkdirs()
        iconFile.parentFile.mkdirs()
        ImageIO.write(brandBanner(),"png",bannerFile)
        ImageIO.write(brandIcon(),"png",iconFile)
        if(!bannerFile.exists()||bannerFile.length()<1000||!iconFile.exists())
            throw new GradleException("Launcher asset generation failed")
        logger.lifecycle("Telares TV launcher branding generated: banner 320x180 and icon 192x192")
    }
}
tasks.named("preBuild") { dependsOn(tasks.named("generateTvBranding")) }
