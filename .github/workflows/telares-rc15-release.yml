name: Telares RC15 verified publication
on:
  push:
    branches: [telares-release-candidate]
    paths:
      - shock-tv-hub/design/release.json
      - shock-tv-hub/scripts/publish_rc15.py
      - .github/workflows/telares-rc15-release.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: telares-rc15-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'TioKing0/OpenAirTV'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and publish exact-commit RC15 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python shock-tv-hub/scripts/publish_rc15.py
