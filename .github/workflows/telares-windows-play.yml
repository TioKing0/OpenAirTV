name: Telares Play Windows x86 x64
on:
  push:
    branches: [telares-release-candidate]
    paths:
      - "shock-tv-hub/windows/play/**"
      - "shock-tv-hub/windows/generate_icon.py"
      - "shock-tv-hub/design/release.json"
      - ".github/workflows/telares-windows-play.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player:
    name: Telares Play portable ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            python_arch: x86
            vlc_arch: win32
          - arch: x64
            python_arch: x64
            vlc_arch: win64
    steps:
      - uses: actions/checkout@v4
      - name: Obtain compatible OpenSSL runtime from official Python distribution
        uses: actions/setup-python@v5
        id: ssl-runtime
        with:
          python-version: '3.10'
          architecture: ${{ matrix.python_arch }}
      - name: Collect embedded native dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shock-tv-hub/windows/play/native-runtime | Out-Null
          $sslRoot=Split-Path '${{ steps.ssl-runtime.outputs.python-path }}'
          Copy-Item "$sslRoot/DLLs/libcrypto-1_1*.dll" shock-tv-hub/windows/play/native-runtime/
          Copy-Item "$sslRoot/DLLs/libssl-1_1*.dll" shock-tv-hub/windows/play/native-runtime/
          if ('${{ matrix.arch }}' -eq 'x64') {
            Copy-Item shock-tv-hub/windows/play/native-runtime/libcrypto-1_1.dll shock-tv-hub/windows/play/native-runtime/libcrypto-1_1-x64.dll
            Copy-Item shock-tv-hub/windows/play/native-runtime/libssl-1_1.dll shock-tv-hub/windows/play/native-runtime/libssl-1_1-x64.dll
          }
          Copy-Item "$sslRoot/LICENSE.txt" shock-tv-hub/windows/play/native-runtime/PYTHON-OPENSSL-LICENSE.txt
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt=Get-ChildItem "$vs/VC/Redist/MSVC/*/${{ matrix.arch }}/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'Visual C++ redistributable not found' }
          Copy-Item "$($crt.FullName)/*.dll" shock-tv-hub/windows/play/native-runtime/
          if (!(Get-ChildItem shock-tv-hub/windows/play/native-runtime/libcrypto*.dll)) { throw 'OpenSSL missing' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
      - name: Verify source syntax and core logic
        shell: pwsh
        run: |
          python -m compileall -q shock-tv-hub/windows/play
          python -m unittest discover -s shock-tv-hub/windows/play/tests -v
      - name: Install executable build requirements
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0 Pillow==11.1.0 python-vlc==3.0.21203 libtorrent==2.0.11
          python shock-tv-hub/windows/generate_icon.py
      - name: Download and verify VideoLAN VLC runtime
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $arch="${{ matrix.vlc_arch }}"
          $prefix="https://download.videolan.org/pub/videolan/vlc/3.0.21/$arch/vlc-3.0.21-$arch.7z"
          Invoke-WebRequest -Uri "$prefix" -OutFile "vlc-runtime.7z" -MaximumRedirection 8
          Invoke-WebRequest -Uri "$prefix.sha256" -OutFile "vlc-runtime.sha256" -MaximumRedirection 8
          $expected=((Get-Content "vlc-runtime.sha256" -Raw) -split "\s+")[0].ToLower()
          $actual=(Get-FileHash "vlc-runtime.7z" -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "VideoLAN runtime SHA256 mismatch $expected vs $actual" }
          7z x vlc-runtime.7z "-ovlc-extract" -y | Out-Null
          $dll=Get-ChildItem -Path vlc-extract -Filter libvlc.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw "libvlc.dll was not found" }
          if (-not (Test-Path (Join-Path $dll.DirectoryName "plugins"))) { throw "VLC plugins folder missing" }
          Copy-Item -Path $dll.DirectoryName -Destination shock-tv-hub/windows/play/vlc -Recurse
          Write-Host "VLC verified and copied:" $dll.DirectoryName
      - name: Generate synthetic playback media
        shell: pwsh
        run: |
          python -m pip install imageio-ffmpeg==0.6.0 --platform win_amd64 --only-binary=:all: --target .fixture-tools
          $env:TELARES_FFMPEG=(Get-ChildItem .fixture-tools/imageio_ffmpeg/binaries/ffmpeg*.exe | Select-Object -First 1).FullName
          python shock-tv-hub/scripts/generate_playback_fixtures.py shock-tv-hub/test-fixtures
      - name: Native torrent and bundled VLC playback smoke test
        shell: pwsh
        run: python shock-tv-hub/windows/play/self_test.py shock-tv-hub/test-fixtures
      - name: Build standalone Telares Play
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --contents-directory . --noconsole --name TelaresPlay --icon shock-tv-hub/windows/TelaresInstall.ico --paths shock-tv-hub/windows/play --hidden-import vlc --hidden-import libtorrent --hidden-import self_test --copy-metadata libtorrent --add-data "shock-tv-hub/windows/play/vlc;vlc" --add-data "shock-tv-hub/windows/play/native-runtime;native-runtime" shock-tv-hub/windows/play/main.py
          if (!(Test-Path dist/TelaresPlay/TelaresPlay.exe)) { throw "Missing TelaresPlay.exe" }
          if (!(Test-Path dist/TelaresPlay/vlc/libvlc.dll)) { throw "Missing VLC runtime" }
          if (!(Test-Path dist/TelaresPlay/vlc/plugins)) { throw "Missing VLC codecs" }
          Copy-Item shock-tv-hub/windows/play/README.md dist/TelaresPlay/LEIA-ME.txt
          Copy-Item shock-tv-hub/windows/play/THIRD-PARTY-TORRENT.txt dist/TelaresPlay/THIRD-PARTY-TORRENT.txt
          Compress-Archive -Path dist/TelaresPlay/* -DestinationPath "dist/Telares-Play-Windows-v0.2.12-RC15-${{ matrix.arch }}-PORTABLE.zip" -CompressionLevel Optimal
          if (!(Test-Path "dist/Telares-Play-Windows-v0.2.12-RC15-${{ matrix.arch }}-PORTABLE.zip")) { throw "ZIP missing" }
      - name: Verify packaged executable playback
        shell: pwsh
        run: |
          $env:TELARES_TEST_LOG="$((Get-Location).Path)/packaged-test.log"
          try {
            $task = Start-Process -FilePath "dist/TelaresPlay/TelaresPlay.exe" -ArgumentList @("--self-test", "$((Get-Location).Path)/shock-tv-hub/test-fixtures") -PassThru -WindowStyle Hidden
            if (!$task.WaitForExit(120000)) { $task.Kill(); throw "Packaged playback timed out" }
            if ($task.ExitCode -ne 0) { throw "Packaged native playback failed" }
          } finally { if (Test-Path packaged-test.log) { Get-Content packaged-test.log } }
      - uses: actions/upload-artifact@v4
        with:
          name: Telares-Play-Windows-v0.2.12-RC15-${{ matrix.arch }}-Portable
          path: dist/Telares-Play-Windows-v0.2.12-RC15-${{ matrix.arch }}-PORTABLE.zip
          if-no-files-found: error
          retention-days: 30

