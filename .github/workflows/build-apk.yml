name: Build OpenAirTV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "OpenAirTV-v0.1-functional-source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  android-tv-11:
    name: Android TV 11 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout OpenAirTV
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Extract receiver source
        run: |
          unzip -q OpenAirTV-v0.1-functional-source.zip -d build-src
          test -f build-src/android-airplay-server/gradlew
          test -f build-src/android-airplay-server/app/src/main/AndroidManifest.xml

      - name: Restore local UxPlay git baseline for patch task
        working-directory: build-src/android-airplay-server/app/src/main/cpp/third_party/UxPlay
        run: |
          git init
          git config user.email "build@openairtv.local"
          git config user.name "OpenAirTV CI"
          git add -A
          git commit -m "UxPlay baseline for OpenAirTV build"

      - name: Build debug APK
        working-directory: build-src/android-airplay-server
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f build-src/android-airplay-server/app/build/outputs/apk/debug/app-debug.apk
          cp build-src/android-airplay-server/app/build/outputs/apk/debug/app-debug.apk OpenAirTV-AndroidTV11-v0.1.apk
          ls -lh OpenAirTV-AndroidTV11-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenAirTV-AndroidTV11-v0.1
          path: OpenAirTV-AndroidTV11-v0.1.apk
          if-no-files-found: error
          retention-days: 30
