name: Build OpenAirTV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "OpenAirTV-v0.1-functional-source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  android-tv-11:
    name: Android TV 11 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout OpenAirTV
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using Android SDK: $SDK_ROOT"
          echo "Using sdkmanager: $SDKMANAGER"
          java -version
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install NDK and CMake
        run: |
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Extract receiver source
        run: |
          unzip -q OpenAirTV-v0.1-functional-source.zip -d build-src
          test -f build-src/android-airplay-server/gradlew
          test -f build-src/android-airplay-server/app/src/main/AndroidManifest.xml
          chmod +x build-src/android-airplay-server/gradlew
          chmod +x build-src/android-airplay-server/app/src/main/cpp/third_party/ffmpeg/configure
          find build-src/android-airplay-server/app/src/main/cpp/third_party/ffmpeg -type f \( -name "*.sh" -o -path "*/configure" \) -exec chmod +x {} \;
          find build-src/android-airplay-server/app/src/main/cpp/third_party/UxPlay -type f -name "*.sh" -exec chmod +x {} \;

      - name: Restore local UxPlay git baseline for patch task
        working-directory: build-src/android-airplay-server/app/src/main/cpp/third_party/UxPlay
        run: |
          git init
          git config user.email "build@openairtv.local"
          git config user.name "OpenAirTV CI"
          git add -A
          git commit -m "UxPlay baseline for OpenAirTV build"

      - name: Build debug APK
        working-directory: build-src/android-airplay-server
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f build-src/android-airplay-server/app/build/outputs/apk/debug/app-debug.apk
          cp build-src/android-airplay-server/app/build/outputs/apk/debug/app-debug.apk OpenAirTV-AndroidTV11-v0.1.apk
          ls -lh OpenAirTV-AndroidTV11-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenAirTV-AndroidTV11-v0.1
          path: OpenAirTV-AndroidTV11-v0.1.apk
          if-no-files-found: error
          retention-days: 30
