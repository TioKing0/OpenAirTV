name: Telares Platform Packages
on:
  push:
    branches: [telares-release-candidate]
    paths:
      - "shock-tv-hub/**"
      - ".github/workflows/shock-tv-products.yml"
      - "legacy-tv-hub/**"
      - "legacy-tv-hub/scripts/build_widget.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tv:
    name: Telares TV Android TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shock-tv-hub/android
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Telares TV
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify Android TV launcher
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then echo "aapt not found"; exit 1; fi
          "$AAPT" dump badging "$APK" | tee /tmp/shock-tv-badging.txt
          grep -q '^leanback-launchable-activity:' /tmp/shock-tv-badging.txt
          grep -q "application-icon-" /tmp/shock-tv-badging.txt
          test -s app/src/main/res/drawable-xhdpi/shock_tv_banner.png
          test -s app/src/main/res/drawable-nodpi/shock_tv_icon.png
      - name: Publish Android TV preview
        uses: actions/upload-artifact@v4
        with:
          name: Telares-TV-AndroidTV-v1.0.0-rc7-APK
          path: shock-tv-hub/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Read permanent release signing
        env:
          KEYSTORE_B64: ${{ secrets.SHOCK_TV_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.SHOCK_TV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHOCK_TV_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SHOCK_TV_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > shock-tv-release.jks
            echo "SHOCK_RELEASE_READY=1" >> "$GITHUB_ENV"
          else
            echo "::notice::Permanent signing not yet configured. Debug preview only."
          fi
      - name: Build permanently signed APK
        if: env.SHOCK_RELEASE_READY == '1'
        env:
          SHOCK_TV_SIGNING_PATH: ${{ github.workspace }}/shock-tv-hub/android/shock-tv-release.jks
          SHOCK_TV_SIGNING_STORE_PASSWORD: ${{ secrets.SHOCK_TV_STORE_PASSWORD }}
          SHOCK_TV_SIGNING_ALIAS: ${{ secrets.SHOCK_TV_KEY_ALIAS }}
          SHOCK_TV_SIGNING_KEY_PASSWORD: ${{ secrets.SHOCK_TV_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Publish updateable release APK
        if: env.SHOCK_RELEASE_READY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: Telares-TV-AndroidTV-v1.0.0-rc7-SIGNED
          path: shock-tv-hub/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Telares Install Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Samsung Orsay widget
        shell: pwsh
        run: |
          python legacy-tv-hub/scripts/build_widget.py
          python -c "import zipfile; p='legacy-tv-hub/app/src/main/assets/LegacyTVHub_0.1.3.zip'; z=zipfile.ZipFile(p); assert 'config.xml' in z.namelist()"
      - name: Publish Samsung Orsay widget builds
        uses: actions/upload-artifact@v4
        with:
          name: Telares-Install-Samsung-Orsay-Widget-RC
          path: legacy-tv-hub/app/src/main/assets/LegacyTVHub_0.1.3.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build Windows executable
        shell: pwsh
        run: |
          python shock-tv-hub/windows/generate_icon.py
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --clean --onefile --noconsole --name TelaresInstall --icon shock-tv-hub/windows/TelaresInstall.ico --add-data "legacy-tv-hub/app/src/main/assets/LegacyTVHub_0.1.3.zip;." shock-tv-hub/windows/main.py
          if (!(Test-Path dist/TelaresInstall.exe)) { throw "Windows EXE not found" }
      - name: Publish portable Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Telares-Install-Windows-x64-EXE
          path: dist/TelaresInstall.exe
          if-no-files-found: error
          retention-days: 30

  android-install:
    name: Telares Install Android helper APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Orsay diagnostic widget for Android assets
        run: python3 legacy-tv-hub/scripts/build_widget.py
      - name: Compile Android helper
        working-directory: legacy-tv-hub
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and identity
        run: |
          test -s legacy-tv-hub/app/build/outputs/apk/debug/app-debug.apk
          test -s legacy-tv-hub/app/src/main/assets/LegacyTVHub_0.1.3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Telares-Install-Android-Helper-RC-APK
          path: legacy-tv-hub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows-x86:
    name: Telares Install Windows 32-bit EXE
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x86
      - name: Generate Orsay widget
        shell: pwsh
        run: |
          python legacy-tv-hub/scripts/build_widget.py
          python -c "import zipfile; p='legacy-tv-hub/app/src/main/assets/LegacyTVHub_0.1.3.zip'; z=zipfile.ZipFile(p); assert 'config.xml' in z.namelist()"
      - name: Build native 32-bit Windows installer
        shell: pwsh
        run: |
          python shock-tv-hub/windows/generate_icon.py
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --clean --onefile --noconsole --name TelaresInstall-x86 --icon shock-tv-hub/windows/TelaresInstall.ico --add-data "legacy-tv-hub/app/src/main/assets/LegacyTVHub_0.1.3.zip;." shock-tv-hub/windows/main.py
          if (!(Test-Path dist/TelaresInstall-x86.exe)) { throw "32-bit EXE missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: Telares-Install-Windows-x86-32bit-EXE
          path: dist/TelaresInstall-x86.exe
          if-no-files-found: error
          retention-days: 30
